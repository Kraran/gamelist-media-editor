name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: ubuntu-latest (26.04) has no Python 3.9 any more
        os: [windows-latest, ubuntu-24.04]
        # 3.9 = minimum stated in the README, 3.13 = current
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  e2e:
    name: browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -m e2e -q -rf -p no:logging 2>&1 | tee e2e.log || {
            # Logs are not always reachable: surface failures as annotations
            grep -E "^(FAILED|ERROR)|^E  " e2e.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  frontend:
    name: app.js syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static/app.js
        run: node --check static/app.js

  windows-exe:
    name: Windows .exe (build + smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm GamelistMediaEditor.spec

      - name: Run the .exe and query it
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "roms\snes"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $xml = Join-Path $dir "gamelist.xml"
          Set-Content -Path $xml -Encoding utf8 -Value '<?xml version="1.0"?><gameList><game><path>./a.zip</path><name>Alpha</name><image>./images/a.png</image></game></gameList>'
          python -c "import os,sys; from PIL import Image; d=os.path.join(sys.argv[1],'images'); os.makedirs(d,exist_ok=True); Image.new('RGB',(320,240),(60,140,220)).save(os.path.join(d,'a.png'))" $dir
          $exe = Start-Process -FilePath "dist\GamelistMediaEditor.exe" `
            -ArgumentList "--no-browser", "`"$xml`"" -PassThru `
            -RedirectStandardOutput exe-out.log -RedirectStandardError exe-err.log
          $base = "http://127.0.0.1:5050"
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { Invoke-WebRequest "$base/" -UseBasicParsing | Out-Null; $up = $true }
            catch { Start-Sleep -Milliseconds 500 }
          }
          try {
            if (-not $up) { throw "server did not start" }
            $s = Invoke-RestMethod "$base/api/session"
            if (-not $s.frozen -or -not $s.loaded -or $s.system.folder -ne "snes" -or $s.system.id -ne 4) {
              throw "unexpected session: $($s | ConvertTo-Json -Compress)"
            }
            $html = (Invoke-WebRequest "$base/" -UseBasicParsing).Content
            if ($html -notmatch "brand-version"">v$($s.version)<") { throw "header version missing" }
            if ($html -notmatch 'id="i-device-floppy"') { throw "icon sprite missing from the page" }
            foreach ($u in "/static/app.js", "/static/locales/fr.json", "/favicon.ico", "/static/fonts/fonts.css", "/static/fonts/ibm-plex-sans-latin-wght-normal.woff2", "/static/fonts/saira-condensed-latin-700-normal.woff2") {
              Invoke-WebRequest "$base$u" -UseBasicParsing | Out-Null
            }
            $games = Invoke-RestMethod "$base/api/games"
            if ($games.games.Count -ne 1) { throw "expected 1 game" }
            $thumb = Invoke-WebRequest "$base/api/thumb?path=./images/a.png" -UseBasicParsing
            if ($thumb.Headers["Content-Type"] -notmatch "image/webp") { throw "thumbnail not WebP: $($thumb.Headers['Content-Type'])" }
            $detail = Invoke-RestMethod "$base/api/game/0?path=./a.zip"
            if ($detail.name -ne "Alpha") { throw "game detail failed" }
            # Self-update is offered by the frozen exe (no request to GitHub here)
            $u = Invoke-RestMethod "$base/api/update"
            if (-not $u.can_install -or $u.current -ne $s.version) { throw "updater: $($u | ConvertTo-Json -Compress)" }
            Write-Host "OK: frozen exe serves UI, assets, API and thumbnails (v$($s.version), system $($s.system.folder)=$($s.system.id))"
          } finally {
            try { Invoke-RestMethod -Method Post "$base/api/shutdown" -Headers @{ Origin = $base } | Out-Null } catch {}
            if (-not $exe.WaitForExit(10000)) { Stop-Process -Id $exe.Id -Force }
            Get-Content exe-out.log, exe-err.log -ErrorAction SilentlyContinue
          }

      - name: Self-update helper on the real .exe (fake install)
        shell: pwsh
        run: |
          # The PowerShell helper of gme/updater.py swaps a running onefile .exe:
          # it waits for GME to exit, keeps the previous .exe, restarts it and
          # checks the new version answers. User files next to the .exe stay.
          $app = Join-Path $env:RUNNER_TEMP "Gamelist Media Editor"
          $work = Join-Path $app ".gme-update"
          New-Item -ItemType Directory -Force (Join-Path $work "staging") | Out-Null
          $exe = Join-Path $app "GamelistMediaEditor.exe"
          $new = Join-Path $work "staging\GamelistMediaEditor.exe"
          Copy-Item dist\GamelistMediaEditor.exe $exe
          Copy-Item dist\GamelistMediaEditor.exe $new
          Set-Content -Path (Join-Path $app "ui_settings.json") -Value '{"theme": "light"}' -Encoding utf8
          $ps1 = Join-Path $work "gme-update.ps1"
          python -c "import sys; from gme.updater import HELPER_PS1; open(sys.argv[1], 'w', encoding='utf-8-sig').write(HELPER_PS1)" $ps1
          $base = "http://127.0.0.1:5050"
          function Wait-Up { for ($i = 0; $i -lt 80; $i++) { try { return Invoke-RestMethod "$base/api/session" } catch { Start-Sleep -Milliseconds 500 } }; throw "GME did not answer" }
          $gme = Start-Process -FilePath $exe -ArgumentList "--no-browser" -WorkingDirectory $app -PassThru
          $version = (Wait-Up).version
          $log = Join-Path $work "update.log"
          $helper = Start-Process -FilePath "powershell.exe" -PassThru -ArgumentList @(
            "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "`"$ps1`"",
            "-Target", "`"$exe`"", "-NewFile", "`"$new`"", "-BackupDir", "`"$(Join-Path $work 'previous')`"",
            "-LogFile", "`"$log`"", "-Pids", "$($gme.Id)", "-ExpectVersion", $version, "-HealthUrl", "$base/api/session")
          Start-Sleep -Seconds 2
          try { Invoke-RestMethod -Method Post "$base/api/shutdown" -Headers @{ Origin = $base } | Out-Null } catch {}
          try {
            if (-not $helper.WaitForExit(150000)) { throw "helper still running" }
            Get-Content $log
            if ($helper.ExitCode -ne 0) { throw "helper exit code $($helper.ExitCode)" }
            if (-not (Test-Path (Join-Path $work "previous\GamelistMediaEditor.exe"))) { throw "previous version not kept" }
            if (Test-Path $new) { throw "staged exe still there" }
            if ((Get-Content (Join-Path $app "ui_settings.json") -Raw) -notmatch "light") { throw "user settings changed" }
            if (-not (Select-String -Path $log -Pattern "started" -Quiet)) { throw "restart not confirmed" }
            Write-Host "OK: .exe swapped, v$version restarted and answered, previous .exe kept"
          } finally {
            try { Invoke-RestMethod -Method Post "$base/api/shutdown" -Headers @{ Origin = $base } | Out-Null } catch {}
            Start-Sleep -Seconds 2
            Get-Process GamelistMediaEditor -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GamelistMediaEditor-exe
          path: dist/GamelistMediaEditor.exe
          retention-days: 14
